name: Atualizar RTA Dashboard

on:
  schedule:
    # Roda diariamente às 09:00 no horário de São Paulo/Brasília
    - cron: '0 9 * * *'
      timezone: 'America/Sao_Paulo'

  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  atualizar:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Clona o repositório
      - name: Checkout repositório
        uses: actions/checkout@v4

      # 2. Configura Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala Chrome
      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      # 4. Instala dependências Python
      - name: Instalar dependências
        run: |
          pip install selenium webdriver-manager openpyxl xlrd

      # 5. Roda o script de download
      - name: Baixar relatórios do Interact
        env:
          INTERACT_LOGIN: ${{ secrets.INTERACT_LOGIN }}
          INTERACT_SENHA: ${{ secrets.INTERACT_SENHA }}
        run: python interact_download.py

      # 6. Roda o script de atualização do dashboard
      - name: Atualizar dashboard RTA
        run: python atualizar_dashboard_rta.py --unidade downloads/RTA_Unidade.xlsx --dados downloads/RTA_Dados.xlsx --html index.html --no-push

      # 7. Commit e push dos arquivos atualizados
      - name: Commit e push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add downloads/ resumo_rta.json index.html
          git diff --cached --quiet || git commit -m "Auto-atualização RTA - $(date '+%d/%m/%Y %H:%M')"
          git push
